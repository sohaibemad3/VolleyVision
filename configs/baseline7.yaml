project:
  name: volleyball-group-activity-recognition
  seed: 42

model:
  name: Baseline7
  hidden_size1: 800
  hidden_size2: 512
  num_classes: 8

data:
  videos_root: /path/to/videos
  videos_annot: /path/to/annotations

  dataset_builder: seq_of_cropped_player_team_with_group_classification
  choice_baseline: 6

  train_video_ids: ["1", "3", "6", "7", "10", "13", "15", "16", "18", "22", "23", "31", "32", "36", "38", "39", "40", "41", "42", "48", "50", "52", "53", "54"]
  val_video_ids: ["0", "2", "8", "12", "17", "19", "24", "26", "27", "28", "30", "33", "46", "49", "51"]
  test_video_ids: ["4", "5", "9", "11", "14", "20", "21", "25", "29", "34", "35", "37", "43", "44", "45", "47"]

  train_transform: 4
  eval_transform: 4

  class_names:
    - l-pass
    - r-pass
    - l-spike
    - r_spike
    - l_set
    - r_set
    - l_winpoint
    - r_winpoint

  loader:
    batch_size: 2
    num_workers: 4
    pin_memory: true
    max_players: 12

training:
  device: auto
  epochs: 18
  use_amp: true
  early_stopping_patience: null
  grad_clip_norm: null

loss:
  name: CrossEntropyLoss

optimizer:
  name: AdamW
  learning_rate: 0.0001
  weight_decay: 0.02
  trainable_parameters_only: true

scheduler:
  name: ReduceLROnPlateau
  monitor: val_accuracy
  mode: max
  factor: 0.5
  patience: 2
  threshold: 0.001
  min_lr: 0.000001

evaluation:
  plot_confusion_matrix: true
  print_results: true

outputs:
  checkpoint_path: checkpoints/baseline7/best_val_acc.pth
  test_results_dir: results/baseline7/test
  print_training_confusion_matrix: false
