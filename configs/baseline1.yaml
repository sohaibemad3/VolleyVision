project:
  name: volleyball-group-activity-recognition
  seed: 42

model:
  name: Baseline1
  freeze: false
  dropout_rate: 0.2
  num_classes: 8

data:
  videos_root: /path/to/videos
  videos_annot: /path/to/annotations

  dataset_builder: image_classification
  choice_baseline: 1

  train_video_ids: ["1", "3", "6", "7", "10", "13", "15", "16", "18", "22", "23", "31", "32", "36", "38", "39", "40", "41", "42", "48", "50", "52", "53", "54"]
  val_video_ids: ["0", "2", "8", "12", "17", "19", "24", "26", "27", "28", "30", "33", "46", "49", "51"]
  test_video_ids: ["4", "5", "9", "11", "14", "20", "21", "25", "29", "34", "35", "37", "43", "44", "45", "47"]

  train_transform: 1
  eval_transform: 1

  class_names:
    - l-pass
    - r-pass
    - l-spike
    - r_spike
    - l_set
    - r_set
    - l_winpoint
    - r_winpoint

  loader:
    batch_size: 32
    num_workers: 0
    pin_memory: false
    max_players: 12

training:
  device: cuda
  epochs: 25
  use_amp: false
  early_stopping_patience: null
  grad_clip_norm: null

loss:
  name: CrossEntropyLoss

optimizer:
  name: SGD
  momentum: 0.9
  learning_rate: 0.01
  weight_decay: 1e-5
  trainable_parameters_only: true

scheduler:
  name: CosineAnnealingLR
  T_max: 25
  eta_min: 1e-7

evaluation:
  plot_confusion_matrix: true
  print_results: true

outputs:
  checkpoint_path: checkpoints/baseline1/best_val_acc.pth
  test_results_dir: results/baseline1/test
  print_training_confusion_matrix: false
